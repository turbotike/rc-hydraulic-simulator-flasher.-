; HydraulicController - RC Construction Machine Sound & Hydraulic Simulator
; Based on TheDIYGuy999's Rc_Engine_Sound_ESP32 sound engine
; Stripped to: engine sound + hydraulic sim + RC input + servo/ESC output

[env:esp32]
platform = espressif32@3.2.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = partitions_custom.csv
upload_speed = 921600
monitor_filters = esp32_exception_decoder

lib_deps =
    https://github.com/TheDIYGuy999/statusLED
    https://github.com/TheDIYGuy999/rcTrigger
    https://github.com/bmellink/IBusBM
    https://github.com/madhephaestus/ESP32AnalogRead

; ── Gamepad build (GAMEPAD_MODE) — uses the Bluepad32 core for Bluetooth controllers.
; The flasher auto-selects this env when GAMEPAD_MODE is on. If the platform URL 404s,
; grab the latest zip from https://github.com/ricardoquesada/esp32-arduino-lib-builder/releases
[env:gamepad]
extends = env:esp32
platform = https://github.com/ricardoquesada/esp32-arduino-lib-builder/releases/download/4.1.0/esp32-4.1.0.zip
